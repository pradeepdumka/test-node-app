on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Node.js CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'
      
      - name: Install dependencies  
        run: npm ci
      
      - name: Run the tests
        run: npm run test

      - name: Build the application
        run: npm run build
      
  docker:
    name: Docker Build and Push
    runs-on: ubuntu-latest
    needs:
      - backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend Docker image to docker hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: pradeepdumka/test-app-backend:latest

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs:
      - docker
    if: github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ./docker.compose.dev.yml
          target: ~/
          strip_components: 1

      - name: Deploy latest images on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            sudo mkdir -p /etc/nginx/ssl

            if [ ! -f /etc/nginx/ssl/test-app-backend.crt ] || [ ! -f /etc/nginx/ssl/test-app-backend.key ]; then
              sudo openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
                -keyout /etc/nginx/ssl/test-app-backend.key \
                -out /etc/nginx/ssl/test-app-backend.crt \
                -subj "/CN=${{ secrets.EC2_HOST }}" \
                -addext "subjectAltName=DNS:${{ secrets.EC2_HOST }}"
            fi

            sudo tee /etc/nginx/sites-available/test-app-backend > /dev/null <<'NGINX'
            server {
                listen 80 default_server;
                server_name _ ${{ secrets.EC2_HOST }};

                return 301 https://$host$request_uri;
            }

            server {
                listen 443 ssl default_server;
                server_name _ ${{ secrets.EC2_HOST }};

                ssl_certificate /etc/nginx/ssl/test-app-backend.crt;
                ssl_certificate_key /etc/nginx/ssl/test-app-backend.key;

                location / {
                    proxy_pass http://127.0.0.1:4000;
                    proxy_http_version 1.1;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }
            }
            NGINX

            sudo rm -f /etc/nginx/sites-enabled/default
            sudo ln -sfn /etc/nginx/sites-available/test-app-backend /etc/nginx/sites-enabled/test-app-backend
            sudo nginx -t
            sudo systemctl enable nginx
            sudo systemctl restart nginx

            sudo docker compose --env-file ~/.env -f ~/docker.compose.dev.yml pull
            sudo docker compose --env-file ~/.env -f ~/docker.compose.dev.yml up -d --remove-orphans --wait --wait-timeout 300
            sudo docker compose --env-file ~/.env -f ~/docker.compose.dev.yml ps
            sudo docker image prune -f